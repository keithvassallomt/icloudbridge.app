version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install
  build:
    commands:
      - npm run docs:build
      - npm run build
  post_build:
    commands:
      - aws cloudfront create-invalidation --distribution-id E1GFZEHIC2TM7L --paths "/index.html" "/privacy.html"

artifacts:
  files:
    - '**/*'
  base-directory: 'dist'
  discard-paths: no
